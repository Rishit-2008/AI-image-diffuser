<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realtime AI Image Diffuser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;650&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>Realtime AI Image Diffuser</h1>
            <p class="subtitle">Describe an image and get it back in about a second.</p>
        </header>

        <div class="composer">
            <div class="input-group">
                <input type="text" id="prompt" placeholder="Describe your image" autocomplete="off">
            </div>
            <button id="generate">Generate</button>
        </div>

        <div id="loading" class="loading">
            <span class="spinner"></span>Generating
        </div>

        <div id="gallery" class="gallery"></div>
    </main>

    <div id="lightbox" class="lightbox">
        <div class="lightbox-content">
            <button id="lightbox-close" class="lightbox-close" aria-label="Close">&times;</button>
            <img id="lightbox-img" src="" alt="">
            <p id="lightbox-prompt"></p>
            <button id="lightbox-download" class="lightbox-download">Download</button>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <footer>
        &copy; Rishit Seth. All rights reserved.
    </footer>

    <script src="script.js"></script>
</body>
</html>
